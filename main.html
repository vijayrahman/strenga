<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>strenga — PvP race console</title>
    <style>
      :root{
        --bg0:#07090d;
        --bg1:#0b0f16;
        --bg2:#0f1622;
        --panel:rgba(255,255,255,.045);
        --panel2:rgba(255,255,255,.06);
        --stroke:rgba(255,255,255,.10);
        --stroke2:rgba(255,255,255,.16);
        --txt:#eaf2ff;
        --muted:#a7b3c7;
        --muted2:#7b8aa4;
        --good:#2ee69a;
        --warn:#ffc857;
        --bad:#ff5e7e;
        --accent:#7a86ff;
        --accent2:#49d0ff;
        --chip:#121a2a;
        --shadow: 0 18px 50px rgba(0,0,0,.45);
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
        --rad: 16px;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family:var(--sans);
        color:var(--txt);
        background:
          radial-gradient(1200px 900px at 12% 14%, rgba(122,134,255,.16), transparent 60%),
          radial-gradient(900px 700px at 82% 20%, rgba(73,208,255,.14), transparent 62%),
          radial-gradient(1000px 900px at 55% 92%, rgba(46,230,154,.10), transparent 65%),
          linear-gradient(180deg, var(--bg0), var(--bg1) 30%, var(--bg2));
        overflow-x:hidden;
      }
      a{color:inherit}
      .wrap{
        max-width:1240px;
        margin:0 auto;
        padding:22px 16px 34px;
      }
      header{
        display:flex;
        gap:16px;
        align-items:flex-end;
        justify-content:space-between;
        margin-bottom:18px;
      }
      .brand{
        display:flex;
        flex-direction:column;
        gap:6px;
      }
      .brand h1{
        margin:0;
        letter-spacing:.4px;
        font-size:22px;
        font-weight:780;
        display:flex;
        align-items:center;
        gap:10px;
      }
      .badge{
        font-size:12px;
        padding:3px 9px;
        border:1px solid rgba(255,255,255,.16);
        background: rgba(255,255,255,.06);
        border-radius:999px;
        color: var(--muted);
      }
      .sub{
        color: var(--muted2);
        font-size:13px;
        max-width:620px;
        line-height:1.35;
      }
      .bar{
        display:flex;
        gap:10px;
        align-items:center;
        flex-wrap:wrap;
        justify-content:flex-end;
      }
      .pill{
        display:flex;
        align-items:center;
        gap:8px;
        border:1px solid var(--stroke);
        background: rgba(255,255,255,.04);
        padding:8px 10px;
        border-radius:999px;
        box-shadow: 0 8px 30px rgba(0,0,0,.18);
      }
      .pill label{font-size:12px;color:var(--muted)}
      .pill input{
        width: 320px;
        max-width: 58vw;
        background: transparent;
        border: none;
        outline:none;
        color: var(--txt);
        font-family: var(--mono);
        font-size:12px;
      }
      .btn{
        user-select:none;
        cursor:pointer;
        border-radius: 12px;
        padding: 10px 12px;
        border: 1px solid var(--stroke);
        background: rgba(255,255,255,.05);
        color: var(--txt);
        font-size: 13px;
        font-weight: 660;
        display:inline-flex;
        align-items:center;
        gap:8px;
        transition: transform .08s ease, border-color .12s ease, background .12s ease;
      }
      .btn:hover{border-color: var(--stroke2); background: rgba(255,255,255,.07)}
      .btn:active{transform: translateY(1px)}
      .btn.primary{
        border-color: rgba(122,134,255,.38);
        background: linear-gradient(180deg, rgba(122,134,255,.22), rgba(122,134,255,.10));
      }
      .btn.good{
        border-color: rgba(46,230,154,.42);
        background: linear-gradient(180deg, rgba(46,230,154,.18), rgba(46,230,154,.08));
      }
      .btn.warn{
