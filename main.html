<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>strenga — PvP race console</title>
    <style>
      :root{
        --bg0:#07090d;
        --bg1:#0b0f16;
        --bg2:#0f1622;
        --panel:rgba(255,255,255,.045);
        --panel2:rgba(255,255,255,.06);
        --stroke:rgba(255,255,255,.10);
        --stroke2:rgba(255,255,255,.16);
        --txt:#eaf2ff;
        --muted:#a7b3c7;
        --muted2:#7b8aa4;
        --good:#2ee69a;
        --warn:#ffc857;
        --bad:#ff5e7e;
        --accent:#7a86ff;
        --accent2:#49d0ff;
        --chip:#121a2a;
        --shadow: 0 18px 50px rgba(0,0,0,.45);
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
        --rad: 16px;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family:var(--sans);
        color:var(--txt);
        background:
          radial-gradient(1200px 900px at 12% 14%, rgba(122,134,255,.16), transparent 60%),
          radial-gradient(900px 700px at 82% 20%, rgba(73,208,255,.14), transparent 62%),
          radial-gradient(1000px 900px at 55% 92%, rgba(46,230,154,.10), transparent 65%),
          linear-gradient(180deg, var(--bg0), var(--bg1) 30%, var(--bg2));
        overflow-x:hidden;
      }
      a{color:inherit}
      .wrap{
        max-width:1240px;
        margin:0 auto;
        padding:22px 16px 34px;
      }
      header{
        display:flex;
        gap:16px;
        align-items:flex-end;
        justify-content:space-between;
        margin-bottom:18px;
      }
      .brand{
        display:flex;
        flex-direction:column;
        gap:6px;
      }
      .brand h1{
        margin:0;
        letter-spacing:.4px;
        font-size:22px;
        font-weight:780;
        display:flex;
        align-items:center;
        gap:10px;
      }
      .badge{
        font-size:12px;
        padding:3px 9px;
        border:1px solid rgba(255,255,255,.16);
        background: rgba(255,255,255,.06);
        border-radius:999px;
        color: var(--muted);
      }
      .sub{
        color: var(--muted2);
        font-size:13px;
        max-width:620px;
        line-height:1.35;
      }
      .bar{
        display:flex;
        gap:10px;
        align-items:center;
        flex-wrap:wrap;
        justify-content:flex-end;
      }
      .pill{
        display:flex;
        align-items:center;
        gap:8px;
        border:1px solid var(--stroke);
        background: rgba(255,255,255,.04);
        padding:8px 10px;
        border-radius:999px;
        box-shadow: 0 8px 30px rgba(0,0,0,.18);
      }
      .pill label{font-size:12px;color:var(--muted)}
      .pill input{
        width: 320px;
        max-width: 58vw;
        background: transparent;
        border: none;
        outline:none;
        color: var(--txt);
        font-family: var(--mono);
        font-size:12px;
      }
      .btn{
        user-select:none;
        cursor:pointer;
        border-radius: 12px;
        padding: 10px 12px;
        border: 1px solid var(--stroke);
        background: rgba(255,255,255,.05);
        color: var(--txt);
        font-size: 13px;
        font-weight: 660;
        display:inline-flex;
        align-items:center;
        gap:8px;
        transition: transform .08s ease, border-color .12s ease, background .12s ease;
      }
      .btn:hover{border-color: var(--stroke2); background: rgba(255,255,255,.07)}
      .btn:active{transform: translateY(1px)}
      .btn.primary{
        border-color: rgba(122,134,255,.38);
        background: linear-gradient(180deg, rgba(122,134,255,.22), rgba(122,134,255,.10));
      }
      .btn.good{
        border-color: rgba(46,230,154,.42);
        background: linear-gradient(180deg, rgba(46,230,154,.18), rgba(46,230,154,.08));
      }
      .btn.warn{
        border-color: rgba(255,200,87,.42);
        background: linear-gradient(180deg, rgba(255,200,87,.18), rgba(255,200,87,.08));
      }
      .btn.bad{
        border-color: rgba(255,94,126,.42);
        background: linear-gradient(180deg, rgba(255,94,126,.18), rgba(255,94,126,.08));
      }
      .grid{
        display:grid;
        grid-template-columns: 420px 1fr;
        gap:14px;
        align-items:start;
      }
      @media (max-width: 1040px){
        .grid{grid-template-columns: 1fr}
      }
      .card{
        border:1px solid var(--stroke);
        background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
        border-radius: var(--rad);
        box-shadow: var(--shadow);
        overflow:hidden;
      }
      .card .hd{
        padding: 14px 14px 10px;
        border-bottom: 1px solid rgba(255,255,255,.08);
        display:flex;
        align-items:flex-end;
        justify-content:space-between;
        gap:10px;
      }
      .card .hd h2{
        margin:0;
        font-size:14px;
        letter-spacing:.35px;
        font-weight: 780;
      }
      .card .hd .mini{
        font-size: 12px;
        color: var(--muted2);
        display:flex;
        gap:10px;
        align-items:center;
      }
      .card .bd{padding: 12px 14px 14px}
      .row{display:flex; gap:10px; flex-wrap:wrap}
      .col{display:flex; flex-direction:column; gap:8px}
      .k{
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .v{
        font-family: var(--mono);
        font-size: 12px;
        color: var(--txt);
      }
      .muted{color: var(--muted2)}
      .sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
      .field{
        display:flex;
        flex-direction:column;
        gap:6px;
        min-width: 180px;
      }
      .field label{
        font-size: 12px;
        color: var(--muted);
      }
      .field input, .field select, .field textarea{
        width:100%;
        background: rgba(0,0,0,.22);
        border: 1px solid rgba(255,255,255,.12);
        color: var(--txt);
        padding: 10px 10px;
        border-radius: 12px;
        outline:none;
        font-size: 13px;
        font-family: var(--mono);
      }
      .field textarea{min-height: 84px; resize: vertical; font-family: var(--mono)}
      .field input:focus, .field select:focus, .field textarea:focus{
        border-color: rgba(73,208,255,.36);
        box-shadow: 0 0 0 3px rgba(73,208,255,.10);
      }
      .help{
        color: var(--muted2);
        font-size: 12px;
        line-height:1.35;
      }
      .list{
        display:flex;
        flex-direction:column;
        gap:10px;
      }
      .item{
        border:1px solid rgba(255,255,255,.10);
        background: rgba(0,0,0,.18);
        border-radius: 14px;
        padding: 12px;
      }
      .item .top{
        display:flex;
        justify-content:space-between;
        gap:10px;
        align-items:flex-start;
      }
      .chip{
        padding: 3px 8px;
        border-radius:999px;
        border:1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.05);
        font-size: 12px;
        color: var(--muted);
        font-family: var(--mono);
      }
      .chip.good{border-color: rgba(46,230,154,.35); color: rgba(46,230,154,.95); background: rgba(46,230,154,.08)}
      .chip.warn{border-color: rgba(255,200,87,.35); color: rgba(255,200,87,.96); background: rgba(255,200,87,.08)}
      .chip.bad{border-color: rgba(255,94,126,.35); color: rgba(255,94,126,.96); background: rgba(255,94,126,.08)}
      .chip.primary{border-color: rgba(122,134,255,.35); color: rgba(122,134,255,.96); background: rgba(122,134,255,.08)}
      .mono{font-family: var(--mono)}
      .tiny{font-size:12px}
      .actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
      .toastHost{
        position: fixed;
        right: 14px;
        bottom: 14px;
        display:flex;
        flex-direction:column;
        gap:10px;
        width: min(420px, calc(100vw - 28px));
        z-index: 50;
        pointer-events:none;
      }
      .toast{
        pointer-events:auto;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 14px;
